<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop API · TesterHub</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="/docs/scalar.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi.yaml',
        proxyUrl: '',
        hideClientButton: true,
        showDeveloperTools: 'never',
        agent: { disabled: true },
        mcp: { disabled: true },
        documentDownloadType: 'yaml',
        featuredClients: ['shell/curl'],
        // Scalar 1.75 has no configuration switch for localhost SDK promotions.
        customCss: `
          .explore-scalar-pill,
          .generate-sdk-button,
          .selected-client-row .selected-client-action[aria-haspopup="dialog"] {
            display: none !important;
          }
        `,
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' }
      });
    </script>
  </body>
</html>
